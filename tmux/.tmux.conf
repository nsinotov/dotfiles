# ===========================================
# Tmux Configuration
# ===========================================

# ------------------------------------
# Prefix & Reload
# ------------------------------------

# Change prefix from C-b to C-s (more ergonomic)
set -g prefix C-s
unbind C-b
bind C-s send-prefix

# Reload config with prefix + r
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# ------------------------------------
# Terminal & Colors
# ------------------------------------

# Enable true color support (required for Catppuccin, Neovim)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Pass cursor shape escape sequences through to the terminal
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# OSC 52 clipboard capability (allows copy to reach system clipboard over SSH)
set -as terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'

# Enable extended keys (Option+Arrow, etc.)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Enable clickable hyperlinks (URLs in output open in browser)
set -as terminal-features ',xterm-256color:hyperlinks'

# Allow terminal escape sequences to pass through tmux
set -g allow-passthrough on

# Use OSC 52 to set system clipboard from copy mode (works over SSH)
set -g set-clipboard on

# ------------------------------------
# General Settings
# ------------------------------------

# Start windows/panes at 1 (0 is far from prefix key)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed (no gaps)
set -g renumber-windows on

# Scrollback buffer (lines kept in history)
set -g history-limit 10000

# Enable mouse (scroll, click to select pane, resize)
set -g mouse on

# No delay after pressing Escape (critical for Vim/Neovim)
set -sg escape-time 0

# How long tmux messages stay on screen (ms)
set -g display-time 4000

# Status bar refresh interval (seconds)
set -g status-interval 5

# Pass focus events to programs inside tmux (Neovim autoread, etc.)
set -g focus-events on

# ------------------------------------
# Vi Mode & Copy
# ------------------------------------

# Use vi keys in copy mode
setw -g mode-keys vi

# v to start selection, y to copy to system clipboard
bind -T copy-mode-vi v send-keys -X begin-selection
if-shell "uname | grep -q Darwin" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'"
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Mouse drag auto-copies to system clipboard on release
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# ------------------------------------
# Pane & Window Management
# ------------------------------------

# Split panes (| horizontal, - vertical) in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Resize panes with vim-style keys (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Cycle through panes with Tab
bind -r Tab select-pane -t :.+

# Clear pane screen and scrollback (like Cmd+K)
bind k send-keys -R \; clear-history \; display-message "Pane cleared!"

# ------------------------------------
# Session Management
# ------------------------------------

# Sort session picker alphabetically (prefix names with 0- to pin to top)
bind s choose-tree -sO name

# Fuzzy picker for sessions and zoxide dirs (prefix + t)
bind t display-popup -E -w 60% -h 60% "sesh connect \"\$(sesh list -i | fzf --no-sort --ansi --border --border-label ' sesh ' --prompt '⚡  ')\""

# ------------------------------------
# Status Bar
# ------------------------------------

set -g status-style 'bg=#181825 fg=#cba6f7'
set -g status-left-length 40
# Prefix indicator: █ lights up when prefix is active
# Zoom indicator: session pill turns peach with 󰊓 icon when pane is zoomed
set -g status-left '#{?client_prefix,#[fg=#cba6f7],#[fg=#181825]}█#{?window_zoomed_flag,#[fg=#181825]#[bg=#fab387],#[fg=#cba6f7]#[bg=#181825]} [#S]#{?window_zoomed_flag, 󰊓,} #[fg=#cba6f7]#[bg=#181825]'
set -g status-right '#[fg=#cba6f7] %Y-%m-%d %H:%M '

# Current window highlighted
setw -g window-status-current-style 'fg=#cba6f7,bg=#181825,bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-style 'fg=#6c7086'
setw -g window-status-format ' #I:#W '

# Pane borders
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#cba6f7,bold'
set -g pane-border-lines heavy
set -g pane-border-indicators arrows
set -g pane-border-status top
set -g pane-border-format ' #{pane_index}: #{pane_current_command} '

# ------------------------------------
# Plugins (managed by TPM)
# ------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Catppuccin theme
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'mocha'

# Navigate between tmux panes and Neovim splits with Ctrl+h/j/k/l
set -g @plugin 'christoomey/vim-tmux-navigator'

# Save and restore tmux sessions across reboots
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Remap resurrect keys to avoid conflict with send-prefix (C-s)
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# ------------------------------------
# Cyrillic-layout duplicates (ЙЦУКЕН → QWERTY positional map)
# ------------------------------------
# When the OS input method is Cyrillic, keys after the prefix produce Cyrillic
# characters and tmux silently drops the binding. These lines duplicate every
# manually-configured prefix binding using the positional Cyrillic equivalents.
#
# Maintainability note: this is a manually-kept parallel section. When you add
# or remove a binding above, mirror the change here. Each pair is commented with
# the QWERTY→Cyrillic mapping so the correspondence is visible at a glance.
#
# Keys NOT duplicated here and why:
#   | - (split panes)   layout-specific: on most Mac ЙЦУКЕН layouts '\' and '/'
#                       are not remapped, so '|' and '-' reach tmux as-is. If
#                       the UA-RU variant does remap them, find what Cyrillic
#                       chars those physical keys produce and add binds here.
#   Tab (next pane)     Tab is layout-invariant — no duplicate needed.
#   C-s (send-prefix)  macOS sends Ctrl+key as the ASCII control code for the
#                       physical key position, ignoring the current IM. So C-s
#                       always reaches tmux as C-s regardless of Cyrillic layout.
#   C-v (copy-mode)    Same Ctrl+physical-key logic applies: Ctrl+V key sends
#                       C-v (rectangle-toggle) regardless of layout. No duplicate.
#   S R (resurrect)    Plugin-managed; see note at bottom of this section.

# r→к: reload config
bind к source-file ~/.tmux.conf \; display-message "Config reloaded!"

# c→с: new window in current path
bind с new-window -c "#{pane_current_path}"

# t→е: fuzzy session/dir picker
bind е display-popup -E -w 60% -h 60% "sesh connect \"\$(sesh list -i | fzf --no-sort --ansi --border --border-label ' sesh ' --prompt '⚡  ')\""

# k→л (lowercase): clear pane screen and scrollback
bind л send-keys -R \; clear-history \; display-message "Pane cleared!"

# s→ы (Russian) / s→і (Ukrainian): session tree picker
bind ы choose-tree -sO name
bind і choose-tree -sO name

# H→Р  J→О  K→Л  L→Д: pane resize (repeatable)
bind -r Р resize-pane -L 5
bind -r О resize-pane -D 5
bind -r Л resize-pane -U 5
bind -r Д resize-pane -R 5

# --- copy-mode-vi Cyrillic duplicates ---
# Custom bindings only; h/j/k/l navigation and word motions added for usability.

# v→м: begin selection
bind -T copy-mode-vi м send-keys -X begin-selection

# y→н: copy to system clipboard
if-shell "uname | grep -q Darwin" \
  "bind -T copy-mode-vi н send-keys -X copy-pipe-and-cancel 'pbcopy'" \
  "bind -T copy-mode-vi н send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'"

# h→р  j→о  k→л  l→д: cursor navigation
bind -T copy-mode-vi р send-keys -X cursor-left
bind -T copy-mode-vi о send-keys -X cursor-down
bind -T copy-mode-vi л send-keys -X cursor-up
bind -T copy-mode-vi д send-keys -X cursor-right

# w→ц  b→и: word motion
bind -T copy-mode-vi ц send-keys -X next-word
bind -T copy-mode-vi и send-keys -X previous-word

# n→т  N→Т: search repeat
bind -T copy-mode-vi т send-keys -X search-again
bind -T copy-mode-vi Т send-keys -X search-reverse

# q→й: cancel / exit copy mode
bind -T copy-mode-vi й send-keys -X cancel

# Resurrect note: @resurrect-save 'S' and @resurrect-restore 'R' are bound by
# the plugin at load time. To add Cyrillic twins (Ы / К), add after tpm runs:
#   bind Ы run-shell "~/.tmux/plugins/tmux-resurrect/scripts/save.sh"
#   bind К run-shell "~/.tmux/plugins/tmux-resurrect/scripts/restore.sh"

# ------------------------------------
# Initialize TPM (must be last line)
# ------------------------------------

run '~/.tmux/plugins/tpm/tpm'
