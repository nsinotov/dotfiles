# ===========================================
# Tmux — F12 nested-session toggle (workstations only)
# ===========================================
# Linked to ~/.config/tmux/nested-toggle.conf by install.sh with the tmux module,
# unless TMUX_NESTED_TOGGLE=false (set that on servers: with the toggle on both
# ends, an accidental double F12 disables the bindings of both sessions).

# F12 disables all local bindings and passes every keystroke through to the
# remote tmux. The status bar dims to signal "pass-through" mode.
# Press F12 again to restore.

bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style 'bg=#181825 fg=#45475a' \;\
  set status-left '#[fg=#45475a,bg=#181825] OFF #[fg=#45475a]#[bg=#181825] [#S] ' \;\
  set status-right '#[fg=#45475a] %Y-%m-%d %H:%M ' \;\
  set window-status-current-style 'fg=#45475a,bg=#181825' \;\
  set window-status-style 'fg=#313244' \;\
  set pane-border-style 'fg=#313244' \;\
  set pane-active-border-style 'fg=#45475a' \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u status-left \;\
  set -u status-right \;\
  set -u window-status-current-style \;\
  set -u window-status-style \;\
  set -u pane-border-style \;\
  set -u pane-active-border-style \;\
  refresh-client -S
